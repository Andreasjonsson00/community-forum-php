services:
  db:
    image: mysql:8.4
    restart: no
    volumes:
      - dbstore:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword

  site:
    depends_on:
    - db
    image: community-forum-php:local
    restart: no
    volumes:
    - ./:/var/www/html
    ports:
    - 8080:80
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword

  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin
    restart: no
    ports:
     - 8081:80
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
volumes:
  dbstore: