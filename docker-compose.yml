services:
  db:
    image: mysql:8.4
    restart: no
    volumes:
      - dbstore:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_NAME: ${DB_NAME}

  site:
    depends_on:
    - db
    image: community-forum-php:local
    restart: no
    volumes:
    - ./:/var/www/html
    ports:
    - 8080:80
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}

  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin
    restart: no
    ports:
     - 8081:80
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
volumes:
  dbstore: